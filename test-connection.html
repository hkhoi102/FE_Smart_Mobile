<!DOCTYPE html>
<html>
<head>
    <title>API Gateway Test</title>
</head>
<body>
    <h1>API Gateway Connection Test</h1>
    <button onclick="testConnection()">Test API Gateway</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';

            try {
                // Test API Gateway health
                const response = await fetch('http://localhost:8085/api/auth/health');
                const data = await response.text();

                resultDiv.innerHTML = `
                    <h3>✅ Success!</h3>
                    <p>Status: ${response.status}</p>
                    <p>Response: ${data}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ Error!</h3>
                    <p>Message: ${error.message}</p>
                    <p>Check if API Gateway is running on port 8085</p>
                `;
            }
        }
    </script>
</body>
</html>
